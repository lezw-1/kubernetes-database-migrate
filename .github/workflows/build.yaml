# Database Migrate — CI Pipeline
#
# Triggers:
#   - Push to dev/staging/prod: build + push image
#
# Required secrets:
#   - CF_ORG_ID:              Cloudfleet organization ID -> run 'cloudfleet organization describe'
#   - CF_ACCESS_TOKEN:        Cloudfleet token ID -> create token via UI and use 'Access Token'
#   - CF_ACCESS_TOKEN_SECRET: Cloudfleet token secret -> create token via UI and use 'Access Token Secret'
#   - CF_CR_REGION:           Cloudfleet container registry region -> get via UI 'https://console.cloudfleet.ai/registry'

name: Build and Push Database Migrate

on:
  push:
    branches: [dev, staging, prod]

env:
  REGISTRY: ${{ secrets.CF_ORG_ID }}.${{ secrets.CF_CR_REGION }}.registry.cloudfleet.dev
  IMAGE_TAG: ${{ github.ref_name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Cloudfleet Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.CF_ACCESS_TOKEN }}
          password: ${{ secrets.CF_ACCESS_TOKEN_SECRET }}

      - name: Build and push database-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/database-migrate:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/database-migrate:${{ github.sha }}
          cache-to: type=gha,scope=database-migrate,mode=max
          cache-from: type=gha,scope=database-migrate
